name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag hover / windows / ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Trigger bisection (3 runs)
        shell: bash
        run: |
          for i in 1 2 3; do echo "=== RUN $i"; python tests/_diag_trigger.py; done
