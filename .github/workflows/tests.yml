name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag v1.0.0: legacy-file compatibility tests
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install RevisionWorx and OpenMeridian, for the RevisionWorx tests
        run: |
          python -m pip install --no-deps "git+https://github.com/nrobertson152/RevisionWorx.git"
          python -m pip install --no-deps "git+https://github.com/nrobertson152/OpenMeridian.git"
      - name: Install Tk and Xvfb, and KiCad to read the KiCad export (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Byte-compile package and tests
        run: python -m compileall -q openschematix tests
      - name: Repository integrity checks
        run: python -m pytest -q tests/test_repo_integrity.py
      - name: Run pytest (Linux with virtual display)
        if: runner.os == 'Linux'
        env:
          OPENSCHEMATIX_REQUIRE_KICAD: "1"      # the KiCad tests must run here, not skip
        run: xvfb-run -a python -m pytest -q --tb=short -ra --durations=20
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q --tb=short -ra --durations=20
      - name: Re-run failures with full tracebacks
        if: failure()
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest --lf -vv --tb=long -ra
          else
            python -m pytest --lf -vv --tb=long -ra
          fi
          exit 0

  kicad-current:
    # The export is KiCad 7's format, which later KiCad versions read. Here the newest KiCad reads it too.
    name: KiCad ${{ matrix.kicad }} reads the KiCad export
    runs-on: ubuntu-latest
    timeout-minutes: 20          # KiCad's archive is sometimes slow; a stuck install shouldn't hold CI for hours
    strategy:
      fail-fast: false
      matrix:
        kicad: ['8.0', '9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install KiCad ${{ matrix.kicad }}
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-${{ matrix.kicad }}-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: The KiCad tests, against this KiCad
        env:
          OPENSCHEMATIX_REQUIRE_KICAD: "1"
        run: python -m pytest -q -ra tests/test_kicad.py

  gui-smoke:
    name: GUI smoke / Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install virtual display and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run GUI smoke checks
        run: xvfb-run -a python tests/gui_smoke.py "${{ runner.temp }}/gui-smoke"

  gui-smoke-windows:
    name: GUI smoke / Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run native Windows GUI smoke checks
        run: python tests/gui_smoke.py "${{ runner.temp }}/gui-smoke"
