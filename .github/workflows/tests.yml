name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Tk and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Byte-compile package and tests
        run: python -m compileall -q openschematix tests
      - name: Repository integrity checks
        run: python -m pytest -q tests/test_repo_integrity.py
      - name: Run pytest (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --tb=short -ra --durations=20
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q --tb=short -ra --durations=20
      - name: Re-run failures with full tracebacks
        if: failure()
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest --lf -vv --tb=long -ra
          else
            python -m pytest --lf -vv --tb=long -ra
          fi
          exit 0

  gui-smoke:
    name: GUI smoke / Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install virtual display and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run GUI smoke checks
        run: xvfb-run -a python tests/gui_smoke.py "${{ runner.temp }}/gui-smoke"

  gui-smoke-windows:
    name: GUI smoke / Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run native Windows GUI smoke checks
        run: python tests/gui_smoke.py "${{ runner.temp }}/gui-smoke"
