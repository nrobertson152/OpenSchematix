name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag hover / windows / ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Run hover module 15 times
        shell: bash
        run: |
          for i in $(seq 1 15); do
            echo "=== ITERATION $i"
            python -m pytest -q -s -p no:randomly tests/test_hover_highlighting.py || true
          done
