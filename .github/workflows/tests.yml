name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: verify hover fix / windows / ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Full suite 10 times
        shell: bash
        run: |
          for i in $(seq 1 10); do
            echo "=== FULL $i"
            PYTHONPATH=tests python -m pytest -q -s -p _diagplug -p _sizeplug tests/ 2>&1 | grep -E "\[diag\] _restore|\[size\]|passed|failed|FAILED" || true
          done
      - name: Hover module alone 10 times
        shell: bash
        run: |
          for i in $(seq 1 10); do
            echo "=== MODULE $i"
            PYTHONPATH=tests python -m pytest -q -s -p _sizeplug tests/test_hover_highlighting.py 2>&1 | grep -E "\[size\]|passed|failed|FAILED" || true
          done
