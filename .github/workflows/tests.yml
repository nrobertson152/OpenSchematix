name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag hover / windows / ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Run the full suite 8 times
        shell: bash
        run: |
          for i in $(seq 1 10); do
            echo "=== ITERATION $i"
            PYTHONPATH=tests python -m pytest -q -s -p _diagplug tests/ 2>&1 | grep -E "\[diag\]|DIAG|STEP|^\('redraw|passed|failed" || true
          done
