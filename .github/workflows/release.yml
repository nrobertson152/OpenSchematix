# Builds OpenSchematix for Linux (tar.gz + AppImage) and Windows (installer + portable zip)
# and attaches the files to the GitHub release.
#
# Runs when a release is published on GitHub (Releases -> Draft a new release -> Publish).
# "Run workflow" on the Actions tab builds the same files as downloadable artifacts without a release.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (tar.gz + AppImage)
    # The oldest supported Ubuntu runner: binaries built here run on newer distributions (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag v1.0.0: legacy-file compatibility tests

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb imagemagick fonts-dejavu-core libxtst6

      # The distribution's Python is used on purpose: its Tk has Xft (anti-aliased fonts).
      - name: Set up build environment
        run: |
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install -r packaging/requirements-release.txt

      - name: Verify release version metadata
        run: python3 packaging/check_release_version.py

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        run: |
          V=$(python3 -c "import openschematix; print(openschematix.VERSION)")
          T="${GITHUB_REF_NAME#v}"
          if [ "$V" != "$T" ]; then echo "Tag $GITHUB_REF_NAME does not match program version $V"; exit 1; fi

      - name: Unit tests
        # under a virtual display: without one every Tk test is skipped
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .build-venv/bin/python -m pytest -q -ra tests

      - name: GUI test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .build-venv/bin/python tests/gui_smoke.py gui-test-output

      - name: Build bundle
        run: |
          .build-venv/bin/python -m PyInstaller --noconfirm --clean packaging/openschematix.spec
          VERSION=$(python3 -c "import openschematix; print(openschematix.VERSION)")
          cp packaging/linux/install.sh packaging/linux/openschematix.desktop packaging/linux/openschematix-mime.xml dist/OpenSchematix/
          cp openschematix/resources/openschematix-256.png dist/OpenSchematix/openschematix.png
          chmod +x dist/OpenSchematix/install.sh
          mkdir -p dist/OpenSchematix/examples
          cp examples/*.schematix examples/*.osch dist/OpenSchematix/examples/
          tar -C dist -czf "dist/OpenSchematix-${VERSION}-linux-x86_64.tar.gz" OpenSchematix
          xvfb-run -a dist/OpenSchematix/OpenSchematix --version

      - name: Packaged GUI check (bundle)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .build-venv/bin/python packaging/ci/packaged_smoke.py dist/OpenSchematix/OpenSchematix

      - name: Build AppImage
        run: |
          bash packaging/linux/build_appimage.sh
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/OpenSchematix-*-x86_64.AppImage --version

      - name: Packaged GUI check (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .build-venv/bin/python packaging/ci/packaged_smoke.py "$(ls dist/OpenSchematix-*-x86_64.AppImage)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/OpenSchematix-*-x86_64.AppImage

  windows:
    name: Windows (installer + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag v1.0.0: legacy-file compatibility tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up build environment
        run: |
          python -m pip install -r packaging/requirements-release.txt

      - name: Verify release version metadata
        run: python packaging/check_release_version.py

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = python -c "import openschematix; print(openschematix.VERSION)"
          $tagVersion = '${{ github.event.release.tag_name }}' -replace '^v', ''
          if ($version -ne $tagVersion) { throw "Tag $tagVersion does not match program version $version" }

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging\openschematix.spec

      - name: Check the executable starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\OpenSchematix\OpenSchematix.exe" -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "OpenSchematix.exe --version failed" }

      - name: Packaged GUI check
        run: python packaging/ci/packaged_smoke.py dist\OpenSchematix\OpenSchematix.exe

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $v = python -c "import openschematix; print(openschematix.VERSION)"
          New-Item -ItemType Directory -Force dist\OpenSchematix\examples | Out-Null
          Copy-Item examples\* dist\OpenSchematix\examples\
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler unavailable: $iscc" }
          & $iscc "/DMyAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\OpenSchematix -DestinationPath "dist\OpenSchematix-$v-windows-x64-portable.zip"
          Copy-Item installer_output\*.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  publish:
    name: Attach files to the release
    if: github.event_name == 'release'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" files/* --clobber --repo "${{ github.repository }}"
